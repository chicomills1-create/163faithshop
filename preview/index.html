<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>16:3 Faith — Watch · Listen · Read · Pray</title>
<meta name="description" content="16:3 Faith — the futuristic hip-hop church. Seven hubs: Watch, Listen, Read, Pray, Community, Give, Shop. Commit thy works unto the LORD. — Proverbs 16:3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23d4af37' font-family='Georgia'>16:3</text></svg>">
<link rel="stylesheet" href="assets/css/shell.css">
</head>
<body>

<!-- ===== TOP BAR (desktop nav / brand + account controls) ===== -->
<header class="topbar">
  <a class="wordmark" href="#/home" data-nav="home">16:3 <b>FAITH</b></a>
  <nav class="topnav" aria-label="Hubs">
    <a href="#/watch" data-nav="watch">Watch</a>
    <a href="#/listen" data-nav="listen">Listen</a>
    <a href="#/read" data-nav="read">Read</a>
    <a href="#/pray" data-nav="pray">Pray</a>
    <a href="#/community" data-nav="community">Community</a>
    <a href="#/give" data-nav="give">Give</a>
    <a href="#/shop" data-nav="shop">Shop</a>
  </nav>
  <div class="account">
    <!-- §3.8: JOIN lives here, in global account controls — never a hub. -->
    <button class="acct-btn" id="btn-signin" type="button">Sign in</button>
    <button class="acct-btn gold" id="btn-join" type="button">Join</button>
  </div>
</header>

<!-- ===== HUB ROOT — only this region is replaced on a hub switch ===== -->
<main id="hub-root" tabindex="-1" aria-live="polite"></main>

<!-- ===== PERSISTENT PLAYER — mounted once, OUTSIDE the hub root.
     Hub switches never touch this node, so playback never interrupts (§4 gate). ===== -->
<section id="player" aria-label="Music player">
  <button type="button" class="player-cover" id="player-cover" aria-label="Open now playing" disabled><span>16:3</span></button>
  <div class="player-meta">
    <div class="player-title-row">
      <button type="button" class="player-title" id="player-title" disabled>Nothing playing</button>
      <span class="prov-chip" id="player-prov" hidden>Full song · YouTube</span>
    </div>
    <div class="player-sub" id="player-sub">Pick a song in the Listen hub</div>
    <div class="player-seekrow">
      <span id="player-elapsed">0:00</span>
      <input type="range" id="player-seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
      <span id="player-total"></span>
    </div>
  </div>
  <div class="player-controls">
    <button type="button" id="btn-prev" aria-label="Previous track" hidden>⏮</button>
    <button type="button" id="btn-play" aria-label="Play" hidden>▶</button>
    <button type="button" id="btn-next" aria-label="Next track" hidden>⏭</button>
    <button type="button" id="btn-close" aria-label="Stop and clear the player" hidden>✕</button>
  </div>
  <!-- YouTube engine (PLAYER LAW: source = YouTube, face = cover + our
       transport, NO video surface). The iframe is a 1px offscreen holder —
       never a visible video element. -->
  <div id="yt-holder" aria-hidden="true"><div id="yt-player"></div></div>
  <audio id="player-audio" preload="none"></audio>
</section>

<!-- ===== STAGE — expanded now-playing (Kairo parity G-01/G-02/G-03).
     Mounted once, OUTSIDE the hub root like the bar; opening it never
     touches the engines, so playback never interrupts. The face is the
     track's exact album cover at hero scale + Faith's own transport —
     NO video surface ever (PLAYER LAW). ===== -->
<section id="stage" aria-label="Now playing" hidden>
  <div class="stage-backdrop" id="stage-backdrop"></div>
  <div class="stage-plate">
    <button type="button" class="stage-collapse" id="btn-stage-collapse" aria-label="Collapse now playing">⌄</button>
    <div class="stage-cover" id="stage-cover"><span>16:3</span></div>
    <div class="stage-title" id="stage-title">Nothing playing</div>
    <div class="stage-sub" id="stage-sub"></div>
    <div class="stage-prov" id="stage-prov" hidden>Full song · YouTube</div>
    <div class="stage-ended" id="stage-ended" hidden>
      <span id="stage-ended-line">Song ended</span>
      <button type="button" class="btn-gold" id="btn-replay">↻ Replay</button>
    </div>
    <div class="player-seekrow stage-seekrow">
      <span id="stage-elapsed">0:00</span>
      <input type="range" id="stage-seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
      <span id="stage-total"></span>
    </div>
    <div class="player-controls stage-controls">
      <button type="button" id="btn-prev2" aria-label="Previous track" hidden>⏮</button>
      <button type="button" id="btn-play2" aria-label="Play">▶</button>
      <button type="button" id="btn-next2" aria-label="Next track" hidden>⏭</button>
      <button type="button" id="btn-repeat" aria-label="Repeat this song" aria-pressed="false">↻<sup class="rep-one">1</sup></button>
    </div>
    <div class="stage-queue" id="stage-queue" hidden>
      <h3 id="stage-queue-label">Up next</h3>
      <div class="trows stage-queue-rows" id="stage-queue-rows"></div>
    </div>
  </div>
</section>

<!-- ===== BOTTOM BAR (mobile persistent hub nav) ===== -->
<nav class="bottombar" aria-label="Hubs">
  <a href="#/watch" data-nav="watch"><span class="bn-ico">▶</span>Watch</a>
  <a href="#/listen" data-nav="listen"><span class="bn-ico">♪</span>Listen</a>
  <a href="#/read" data-nav="read"><span class="bn-ico">✦</span>Read</a>
  <a href="#/pray" data-nav="pray"><span class="bn-ico">✚</span>Pray</a>
  <a href="#/community" data-nav="community"><span class="bn-ico">●</span>Community</a>
  <a href="#/give" data-nav="give"><span class="bn-ico">♥</span>Give</a>
  <a href="#/shop" data-nav="shop"><span class="bn-ico">◆</span>Shop</a>
</nav>

<script type="module" src="assets/js/shell.js"></script>
</body>
</html>
